name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / Go 1.24
            os: ubuntu-latest
            go: '1.24.x'
          - name: macOS / Go stable
            os: macos-latest
            go: stable
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: go.sum

      - name: Verify module checksums
        run: go mod verify

      - name: Test with race detector
        run: go test -race -count=1 -timeout=5m ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o bin/mailme ./cmd/mailme
